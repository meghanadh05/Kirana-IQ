name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kirana_iq
          POSTGRES_USER: kirana
          POSTGRES_PASSWORD: kirana
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Generate and seed the demo store
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: kirana_iq
          POSTGRES_USER: kirana
          POSTGRES_PASSWORD: kirana
        # --train writes the shared model as well, which is what a store without
        # its own trained model falls back to.
        run: |
          python scripts/generate_data.py
          python scripts/seed_demo.py --reset --train

      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: kirana_iq
          POSTGRES_USER: kirana
          POSTGRES_PASSWORD: kirana
        run: pytest -v --strict-markers

      - name: Fail if any test was skipped
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: kirana_iq
          POSTGRES_USER: kirana
          POSTGRES_PASSWORD: kirana
        # The suite skips gracefully when the demo store or model is missing,
        # which is right for a fresh clone and wrong for CI: here everything is
        # present, so a skip means the environment is broken.
        run: |
          output=$(pytest -q -rs 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "[0-9]+ skipped"; then
            echo "::error::Tests were skipped in CI; the environment is incomplete."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build
